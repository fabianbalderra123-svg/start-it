services:
  - type: web
    name: startit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: startit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: PGSSL
        value: "true"

databases:
  - name: startit-db
    plan: free
    databaseName: startit
    user: startit
